<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Argus{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { padding-top: 1rem; }
    .navbar-brand { font-weight: 700; letter-spacing: .05em; }
    code.mono { font-size: .85em; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">ARGUS</a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'programs:list' %}">
          Programas
        </a>
        <a class="btn btn-sm btn-outline-light" href="{% url 'scans:list' %}">
          Scans
        </a>
        <a class="btn btn-sm btn-outline-light" href="{% url 'accounts:me' %}">
          {{ user.username }}
        </a>
        <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-warning">Sair</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'accounts:login' %}">
          Entrar
        </a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
