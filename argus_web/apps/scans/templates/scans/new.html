{% extends "base.html" %}
{% block title %}Novo scan — {{ program.name }}{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Novo scan — {{ program.name }}</h1>

<div class="row">
  <div class="col-md-8">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Alvo (hostname)</label>
        <input name="target" class="form-control" required
               placeholder="ex: api.example.com">
        <small class="text-muted">
          Precisa estar dentro do escopo do programa.
        </small>
      </div>
      <div class="mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox"
                 name="api_scan" checked id="api_scan">
          <label class="form-check-label" for="api_scan">API discovery</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox"
                 name="crawl" checked id="crawl">
          <label class="form-check-label" for="crawl">Crawling (katana)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox"
                 name="vuln_scan" id="vuln_scan">
          <label class="form-check-label" for="vuln_scan">
            Vulnerability scan (nuclei)
            <span class="text-muted text-small">— templates passivos apenas</span>
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox"
                 name="dir_scan" id="dir_scan">
          <label class="form-check-label" for="dir_scan">
            Directory discovery (dirsearch)
            <span class="text-muted text-small">— recursivo (-r)</span>
          </label>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Wordlist de API</label>
        <select name="wordlist" class="form-select">
          <option value="">— default (wordlists/api_paths.txt) —</option>
          {% for w in wordlists %}
            <option value="{{ w.pk }}">
              {{ w.name }} ({{ w.kind }}{% if w.is_builtin %}, embutida{% endif %})
            </option>
          {% endfor %}
        </select>
        <small class="text-muted">
          A wordlist so e usada se "API discovery" estiver marcado.
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label">Wordlist de diretorios</label>
        <select name="dir_wordlist" class="form-select">
          <option value="">— sem wordlist —</option>
          {% for w in dir_wordlists %}
            <option value="{{ w.pk }}">{{ w.name }}{% if w.is_builtin %} (embutida){% endif %}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Dirsearch depth</label>
        <input name="dir_depth" type="number" min="1" max="5"
               value="2" class="form-control" style="width: 8rem;">
      </div>

      <div class="mb-3">
        <label class="form-label">Crawl depth</label>
        <input name="crawl_depth" type="number" min="1" max="10"
               value="3" class="form-control" style="width: 8rem;">
      </div>
      <button class="btn btn-primary">Iniciar scan</button>
      <a class="btn btn-outline-secondary"
         href="{% url 'programs:detail' program.slug %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
